# Registry of distribution licensees and their service territories.
# See docs/data/INDIA_CI_TARIFF_DATA_STRATEGY.md section 5.1.
# Validated against schemas/licensee.schema.json.
#
# IMPORTANT -- sourcing status: entries below were seeded from general/model
# knowledge, NOT from a live crawl of each licensee's or regulator's own
# website, and are candidates pending independent verification per the
# strategy document's authoritative source hierarchy (section 4). Ownership
# structures for several licensees (notably Odisha's Tata Power discoms and
# Uttar Pradesh's PuVVNL/DVVNL privatization status) have changed multiple
# times in recent years and may have changed again since this file was
# seeded -- treat `coverage_status: NOT_STARTED` and the per-entry notes as
# the operative signal, not the presence of an entry itself.
#
# Karnataka's Mysuru-area discom is coded CESCK (not CESC) specifically to
# avoid collision with West Bengal's CESC Limited (Kolkata).

schema_version: "1.0.0"
