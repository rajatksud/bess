# Registry of Indian states and Union Territories in scope for tariff coverage.
# See docs/data/INDIA_CI_TARIFF_DATA_STRATEGY.md section 3.1 and 5.1.
# Validated against schemas/jurisdiction.schema.json.
#
# status: NOT_STARTED | IN_PROGRESS | COVERED | BLOCKED
#
# Priority order per docs/development/TARIFF_CRAWLER_14H_EXECUTION_LOG.md /
# the crawler brief: Maharashtra, Gujarat, Karnataka, Tamil Nadu, Telangana,
# Andhra Pradesh, Delhi, Rajasthan, Uttar Pradesh, Haryana, Madhya Pradesh,
# Odisha, Punjab, West Bengal, Kerala, Chhattisgarh, Bihar, Jharkhand, then
# remaining states/UTs. IN_PROGRESS here means "regulator and/or licensee
# candidates identified, at least one source configured" — not "coverage
# complete." No jurisdiction is marked COVERED until it has a verified,
# ACTIVE-monitored source and at least one reviewed tariff record.

schema_version: "1.0.0"
jurisdictions:
  # States, in the brief's priority order
  - code: MH
    name: Maharashtra
    type: STATE
    status: IN_PROGRESS
    notes: "Priority 1. MERC regulator + MSEDCL and private Mumbai discoms identified; sources not yet ACTIVE-monitored."
  - code: GJ
    name: Gujarat
    type: STATE
    status: IN_PROGRESS
