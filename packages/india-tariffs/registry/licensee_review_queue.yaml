licensee_review_queue:
  - review_id: RQ-001
    candidate_name: "Manipur/Mizoram regulatory split: JERC-MN-MZ vs. MZERC"
    jurisdiction_code: MZ
    related_licensee_code: MZ-PED
    reason: "Mizoram appears to have split off its own state commission (MZERC) from the historical Joint Electricity Regulatory Commission for Manipur and Mizoram (JERC-MN-MZ) around 23 July 2024. MZERC's own site is live and actively issuing Mizoram-specific 2026-dated draft regulations, strongly suggesting it is now the operative regulator for MZ. However, JERC-MN-MZ's own site still describes itself in the present tense as covering both Manipur and Mizoram, and no primary gazette/legal notification for the transition was found or fetched in this research pass."
    evidence_checked: "Direct WebFetch of jerc.mizoram.gov.in/page/jerc-profile (JERC-MN-MZ) and mzerc.mizoram.gov.in (MZERC), both live Government-of-Mizoram-hosted sites. Secondary sources (Vyqon, SolarQuarter, an exploremizoram.com blog post) describe MZERC becoming functional 23 July 2024, but a primary Mizoram Gazette notification (surfaced at mizoramassembly.in/storage/Assembly/Gazette/EO/GZEO38ISS_541.pdf) was found but not fetched/verified."
    suggested_next_step: "Fetch and read the Mizoram Gazette notification directly (mizoramassembly.in/storage/Assembly/Gazette/EO/GZEO38ISS_541.pdf) to confirm the exact date and legal mechanism of the JERC-to-MZERC transition for Mizoram, and check whether JERC-MN-MZ's jurisdiction_codes in this registry (currently ['MN'] only) should be revisited if MZERC's authority turns out to be only partial or still-transitioning."
    status: OPEN

  - review_id: RQ-002
    candidate_name: "Sikkim State Electricity Regulatory Commission (SSERC) -- no confirmed live website"
    jurisdiction_code: SK
    related_licensee_code: SK-PD
    reason: "PARTIALLY RESOLVED 2026-07-31 (second pass): whether Sikkim might instead be covered by a joint commission (JERC) was checked explicitly and ruled out -- Sikkim is a genuine standalone state SERC; India's JERC arrangements cover only Goa+UTs (JERC-GOA-UT) and J&K+Ladakh (JERC-JKL), no JERC exists or has ever existed for Sikkim. SSERC's dead domain issue itself remains UNRESOLVED: sserc.in was re-confirmed dead/squatted (both http/https, root and content paths). A working fallback document source was found instead (selfservice.powersikkim.in, see SIKKIM-POWERSIKKIM-TARIFF source), so Sikkim's tariff data is not entirely inaccessible, but SSERC still has no confirmed primary web presence of its own."
    evidence_checked: "Direct WebFetch of both http:// and https:// sserc.in (root and /content/energy-power-department-govt-sikkim path) all resolved to the same unrelated gambling content, ruling out a protocol- or path-specific issue. WebSearch for a joint-commission arrangement returned only confirmation of SSERC as Sikkim's own SERC (search snippets referencing 'Shri. K.B. Kunwar took charge as Chairperson of Sikkim State Electricity Regulatory Commission' on sikkim.gov.in, and an SSERC-addressed PDF on recregistryindia.nic.in). Direct WebFetch of selfservice.powersikkim.in/assets/home/Tariff-Schedule-FY-2025-26.pdf succeeded (reachable, though binary/not text-extractable)."
    suggested_next_step: "Check the Forum of Regulators directory or Ministry of Power's state-commission listing for a current SSERC URL (a sikkim.gov.in subdomain is plausible given the Chairperson-appointment news item lives on sikkim.gov.in, but no such subdomain was found in this pass). Until found, treat selfservice.powersikkim.in as the working (though lower-authority-rank) source for Sikkim tariff documents."
    status: OPEN

  - review_id: RQ-003
    candidate_name: "Ladakh Power Corporation Ltd (LPCL) vs. Ladakh Power Development Department (LPDD)"
    jurisdiction_code: LA
    related_licensee_code: LA-LPDD
    reason: "LPDD (a government department, not corporatized) is confirmed as the entity that actually files tariff petitions before JERC-JKL and operates Ladakh's distribution. A separate 'Ladakh Power Corporation Ltd (LPCL)' also appears in one secondary source as one of five corporatized entities from the 2019 J&K Power Development Department unbundling (alongside JPDCL, KPDCL, JKPCL, JKPTCL). Whether LPCL is a dormant/legal shell distinct from the operating LPDD, or whether secondary sources are conflating the two, was not resolved."
    evidence_checked: "Direct WebFetch of lpdd.ladakh.gov.in confirmed LPDD as a government department that filed Petition JERC/03 of 2025 (19 Dec 2024). 'LPCL' reference came from a single secondary source (India Investment Grid promoter listing) synthesizing the 2019 unbundling order, not independently fetched from a primary gazette or MCA filing."
    suggested_next_step: "Check the MCA (Ministry of Corporate Affairs) company registry for 'Ladakh Power Corporation Ltd' to determine if it is an active incorporated entity, and if so, what function it performs relative to LPDD (the department that is clearly the operating distribution licensee)."
    status: OPEN

