  - review_id: RQ-006
    candidate_name: "TSERC (Telangana) -- no resolvable domain found"
    jurisdiction_code: TS
    related_licensee_code: TSSPDCL
    reason: "RESOLVED 2026-07-31 (user-supplied correction): the domain issue was because the commission itself renamed/rebranded from TSERC to Telangana Electricity Regulatory Commission (TGERC), matching the state's broader shift from TS to TG as its official abbreviation -- not a DNS/hosting artifact as originally suspected. Confirmed live at https://www.tgerc.telangana.gov.in/, which self-describes: 'Consequent to the formation of Telangana State, Telangana Electricity Regulatory Commission (TGERC) was constituted on 3rd November, 2014' -- same constitution date as the original TSERC identity, confirming this is a rename of the same legal body, not a new commission. Registry updated: regulator code changed TSERC -> TGERC, source TGERC-TARIFF-ORDERS added, licensees.yaml TSSPDCL/TSNPDCL regulator_code updated."
    evidence_checked: "Direct WebFetch of https://www.tgerc.telangana.gov.in/ succeeded, confirming legal name, constitution date, and a live Tariff Orders section (Tariff Schedule, Current Year Orders, Earlier Orders)."
    suggested_next_step: "None -- resolved. Watch for any remaining TSERC references elsewhere in the codebase/docs that should be updated to TGERC."
    status: RESOLVED

