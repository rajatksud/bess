# Registry of State/Joint Electricity Regulatory Commissions.
# See docs/data/INDIA_CI_TARIFF_DATA_STRATEGY.md section 5.1.
# Validated against schemas/regulator.schema.json.
#
# IMPORTANT — sourcing status: entries below were seeded from general/model
# knowledge (not a live crawl of each commission's own website) and are
# candidates pending independent verification against the authoritative
# source hierarchy in the strategy document, section 4. `notes` records the
# verification-confidence caveats known at seeding time. Do not treat a
# `website` value here as authoritative until a human has confirmed it
# resolves to that commission's own official site (section 4 requires the
# final source of record to be the regulator's own site, not a directory or
# secondary summary).
#
# Two SERC codes were previously colliding in spirit: Karnataka's KERC vs.
# Kerala's commission. Kerala is coded KSERC here specifically to avoid that
# collision.

schema_version: "1.0.0"
regulators:
