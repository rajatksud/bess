# Registry of State/Joint Electricity Regulatory Commissions.
# See docs/data/INDIA_CI_TARIFF_DATA_STRATEGY.md section 5.1.
# Validated against schemas/regulator.schema.json.
#
# Sourcing status: entries below were seeded from general/model knowledge and
# then live-probed (WebFetch against each candidate domain, WebSearch to find
# corrected domains where the seeded one didn't resolve) on 2026-07-31.
# `source_health` reflects the actual outcome of that probe, not just URL
# syntax validity. `verification_status`-equivalent detail is recorded in
# `notes` per entry — a HEALTHY probe confirms the site identifies itself as
# the named commission and exposes a tariff-orders link, but does not yet
# constitute full section-4 authoritative-source review of specific tariff
# facts.
#
# Two SERC codes were previously colliding in spirit: Karnataka's KERC vs.
# Kerala's commission. Kerala is coded KSERC here specifically to avoid that
# collision.

