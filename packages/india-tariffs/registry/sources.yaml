    last_verified: "2026-07-31"
    evidence_url: "https://www.derc.gov.in/tarriff-orders"
    notes: "ACTIVATED 2026-07-31 after a real crawl+archive validation pass: 19 links discovered, 19 fetched, 18 new documents archived (2 real application/pdf True-up Order documents for FY2022-23/FY2021-22 confirmed with correct SHA-256 and %PDF- magic bytes; the remaining 16 are HTML sub-category/pagination pages, expected and harmless since the crawler only archives what it fetches, not a failure). The listing is paginated (?page=1..13+) and links out to per-category sub-pages (under-section-142, other-than-142, general-order, supply-code) that themselves contain more per-licensee order PDFs (BRPL/BYPL/TPDDL/NDMC/IPGCL/PPCL per a live page inspection) -- full pagination/sub-page traversal is a follow-up improvement for the generic adapter, not required to confirm this source is genuinely live and yields real authoritative documents. NOTE: fetching this domain from a strict-TLS-verification client (Node's bundled CA store) fails with SELF_SIGNED_CERT_IN_CHAIN because derc.gov.in's server does not send its full certificate chain (confirmed via openssl s_client: only 2 certs sent, no root) -- the crawler's package.json crawl script now runs with --use-system-ca to resolve this by using the OS trust store's chain-completion instead of relying solely on Node's bundled Mozilla roots. This is a real fix for a documented class of Indian .gov.in TLS misconfiguration, not a security weakening (chain validation is still fully enforced, just against a more complete trust anchor)."

