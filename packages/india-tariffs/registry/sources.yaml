# Registry of monitored authoritative sources (listing pages, APIs, feeds, documents).
# See docs/data/INDIA_CI_TARIFF_DATA_STRATEGY.md section 4 and 5.1, and
# docs/architecture/AUTHORITATIVE_TARIFF_CRAWLER_ARCHITECTURE.md section 4.
# Validated against schemas/authoritative_source.schema.json.
#
# Seeded from the URLs explicitly listed in the strategy document. Each entry's
# authority_rank, source_type, include/exclude patterns and adapter are
# provisional pending an actual crawl/review pass (section 8) — these are
# listing pages, not yet-classified individual documents. monitoring_status
# stays NOT_CONFIGURED until a source has been through at least one manual
# verification run (crawler:verify) and last_verified is set.

