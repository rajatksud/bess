name: india-tariffs-crawler

on:
  push:
    branches: [main]
    paths:
      - "packages/india-tariffs/**"
      - ".github/workflows/india-tariffs-crawler.yml"
  pull_request:
    paths:
      - "packages/india-tariffs/**"
      - ".github/workflows/india-tariffs-crawler.yml"

defaults:
  run:
    working-directory: packages/india-tariffs/crawler

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Disposable Postgres service local to this CI run only. No production
    # or shared staging credentials are ever used in CI -- integration tests
    # run against this container and nothing else, gated by APP_ENV=test and
    # loadTestDatabaseConfig()'s destructive-target guard (see src/db/env.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tariff_crawler_ci
          POSTGRES_PASSWORD: ci_only_disposable
          POSTGRES_DB: tariff_crawler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DB_TEST_HOST: localhost
      DB_TEST_PORT: 5432
      DB_TEST_NAME: tariff_crawler_test
      DB_TEST_USER: tariff_crawler_ci
      DB_TEST_PASSWORD: ci_only_disposable
      CRAWLER_DATABASE_SCHEMA: tariff_crawler

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: packages/india-tariffs/crawler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: All tests (unit + DB-gated integration, disposable CI Postgres only)
        run: npm test

      - name: Validate registry YAML loads and is internally consistent
        run: node dist/src/cli.js verify

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build crawler image
        run: |
          docker build \
            -t india-tariffs-crawler:ci-${{ github.sha }} \
            -f packages/india-tariffs/Dockerfile \
            packages/india-tariffs
