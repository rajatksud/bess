name: BESS Calculator CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'bess-calc/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - 'feature/**'
      - 'dev/**'
    paths:
      - 'bess-calc/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bess-calc

jobs:
  test:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    # Ephemeral, disposable Postgres for this CI run only - wiped when the job ends,
    # never staging/prod. Runs the persistence tests (server/__tests__/projects.test.ts
    # etc.) for real; those tests self-skip if DATABASE_URL isn't set, but CI always
    # sets it, so the full 228-test suite (not just the 208 DB-independent ones) runs
    # on every PR/push.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bess_ci
          POSTGRES_PASSWORD: bess_ci
          POSTGRES_DB: bess_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bess_ci:bess_ci@localhost:5432/bess_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm
          cache-dependency-path: bess-calc/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Run tests
        run: pnpm test

      - name: Typecheck frontend and server
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

      - name: Build server
        run: pnpm run build:server

      - name: Audit dependencies (non-blocking)
        run: pnpm audit --audit-level=high || true

  docker:
    name: Container build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: bess-calc
          push: false
          load: true
          tags: bess-calculator:ci
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}

      - name: Validate docker-compose config
        working-directory: bess-calc
        run: docker compose config
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAG: ci

      - name: Smoke-test the built image
        working-directory: bess-calc
        run: |
          docker run -d --name bess-calc-ci -p 8080:8080 bess-calculator:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null; then
              echo "Health check passed"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Health check failed after 15 attempts"
              docker logs bess-calc-ci
              exit 1
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/v1/version
          docker stop bess-calc-ci
          docker rm bess-calc-ci
